{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="margin: 0; font-size: 1.75rem; font-weight: 700;">Enter New Password</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Enter the 4-digit code sent to {{ email }} and choose a new password</p>
    </div>

    <div class="card" style="width: 100%; padding: 2rem; box-sizing: border-box;">
        <form method="POST" action="{% url 'user:reset_password' %}">
            {% csrf_token %}
            <input type="hidden" name="email" value="{{ email }}">
            
            {% if error %}
            <div style="color: var(--danger-color); margin-bottom: 1rem; font-size: 0.875rem; text-align: center;">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}
            
            <div class="input-group">
                <label for="code">4-Digit Verification Code</label>
                <input type="text" name="code" id="code" class="input-control" placeholder="e.g. 1234" maxlength="4" required style="letter-spacing: 0.5rem; text-align: center; font-size: 1.25rem; font-weight: 700;">
            </div>

            <div class="input-group">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" class="input-control" placeholder="New Password" required>
            </div>

            <div class="input-group" style="margin-bottom: 2rem;">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="input-control" placeholder="Confirm New Password" required>
            </div>
            
            <button type="submit" class="btn" style="border-radius: 50px;">Reset Password</button>
        </form>
    </div>

</div>
{% endblock %}
