{% extends 'base.html' %}

{% block content %}
<div class="auth-container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="margin: 0; font-size: 1.75rem; font-weight: 700;">Reset Password</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Enter your email to receive a 4-digit verification code</p>
    </div>

    <div class="card" style="width: 100%; padding: 2rem; box-sizing: border-box;">
        <form method="POST" action="{% url 'user:forgot_password' %}">
            {% csrf_token %}
            
            {% if error %}
            <div style="color: var(--danger-color); margin-bottom: 1rem; font-size: 0.875rem; text-align: center;">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}
            
            <div class="input-group" style="margin-bottom: 2rem;">
                <input type="email" name="email" id="email" class="input-control" placeholder="Email Address" required>
            </div>
            
            <button type="submit" class="btn" style="border-radius: 50px;">Send Code</button>
        </form>
    </div>

    <p style="margin-top: 2rem; color: var(--text-muted); font-size: 0.875rem;">
        Remember your password? <a href="{% url 'user:login' %}" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign in</a>
    </p>

</div>
{% endblock %}
