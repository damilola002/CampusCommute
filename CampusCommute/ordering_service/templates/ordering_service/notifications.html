{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <h2 style="margin: 0; font-size: 1.5rem;">Notifications</h2>
</div>

<div class="board-container">
    {% for notif in notifications %}
    <div class="card" style="display: flex; gap: 1rem; align-items: flex-start; {% if not notif.is_read %}border-left: 4px solid var(--primary-color);{% else %}border-left: 4px solid transparent;{% endif %}">
        
        <div style="padding-top: 0.25rem;">
            <i class="fa-solid fa-bell" style="color: var(--primary-color);"></i>
        </div>

        <div style="flex: 1;">
            <div style="font-size: 1rem; color: var(--text-main);">
                {{ notif.message }}
            </div>
            <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
                {{ notif.created_at|date:"M d, h:i A" }}
            </div>
        </div>

    </div>
    {% empty %}
    <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
        <i class="fa-regular fa-bell-slash" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
        <p>You have no notifications.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
