<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RideShare Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        /* Make the page fill the browser */

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* The map fills the entire page */

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Example title box */

        #header {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;

            background: white;
            padding: 10px 20px;

            border-radius: 10px;
            box-shadow: 0 0 10px gray;

            font-family: Arial, sans-serif;
        }
    </style>

</head>

<body>

    <!-- Header -->

    <div id="header">
        <h2>RideShare Demo</h2>
    </div>

    <!-- This is where the map appears -->

    <div id="map"></div>

    <!-- Leaflet JavaScript -->

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Your JavaScript -->

    <script src="{{ url_for('static', filename='js/map.js') }}"></script>

</body>

</html>
