<!DOCTYPE html>
<html>

<head>

<title>Offer a Ride</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}


.navbar {
    background: #1d4ed8;
    color: white;
    padding: 20px 40px;
}


.container {
    width: 450px;
    margin: 50px auto;
    background: white;
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}


h1 {
    text-align:center;
    margin-bottom:10px;
}


.subtitle {
    text-align:center;
    color:#666;
    margin-bottom:30px;
}


label {
    display:block;
    margin-top:15px;
    font-weight:bold;
}


input {
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid #ddd;
    box-sizing:border-box;
}


.row {
    display:flex;
    gap:15px;
}


.row div {
    width:50%;
}


button {
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1d4ed8;
    color:white;
    font-size:16px;
    cursor:pointer;
}


button:hover {
    background:#163ea8;
}


.success-message {

    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;

}

</style>

</head>


<body>


<div class="navbar">

    <h2> CampusCommute🚗</h2>

</div>



<div class="container">


{% if messages %}

    {% for message in messages %}

        <div class="success-message">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}



<h1>
Offer a Ride
</h1>


<p class="subtitle">
Help another student get where they need to go.
</p>



<form method="POST">

{% csrf_token %}



<label>
Pickup Location
</label>

<input 
type="text"
name="pickup_location"
placeholder="Example: UTA Library"
>



<label>
Destination
</label>

<input 
type="text"
name="destination"
placeholder="Example: Dallas"
>



<div class="row">


<div>

<label>
Date
</label>

<input 
type="date"
name="date">

</div>



<div>

<label>
Time
</label>

<input 
type="time"
name="time">

</div>


</div>



<label>
Seats Available
</label>

<input 
type="number"
name="seats_available"
placeholder="Number of seats"
>



<button>
Offer Ride
</button>



</form>


</div>


</body>

</html>
